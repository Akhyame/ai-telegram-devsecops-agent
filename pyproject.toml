[build-system]
requires = ["setuptools==77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-telegram-devsecops-agent"
version = "0.1.0"
description = "Secure AI-assisted DevSecOps automation controlled through Telegram."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "anyio==4.14.2",
    "uvicorn==0.52.4",
    "pydantic-settings==2.15.0",
    "prometheus-client==0.26.0",
    "python-telegram-bot==22.8",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
    "httpx2==2.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agent*",
  "api*",
  "bot*",
  "deployment*",
  "gitlab_client*",
  "policy_engine*",
  "sample_app*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
branch = true
source = [
  "agent",
  "api",
  "bot",
  "deployment",
  "gitlab_client",
  "policy_engine",
  "sample_app",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
