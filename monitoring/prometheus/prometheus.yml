global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: sample-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: real-fastapi-staging
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
