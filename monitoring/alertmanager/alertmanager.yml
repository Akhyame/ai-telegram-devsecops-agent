route:
  receiver: monitoring-webhook
  group_by:
    - alertname
    - severity
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: monitoring-webhook
    webhook_configs:
      - url: http://api:8000/internal/monitoring/alerts
        send_resolved: true
        max_alerts: 10
        timeout: 5s
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/receiver-token
